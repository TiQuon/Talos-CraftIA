config_version = 1

[hardware]
preset = "cloud_only"

[quality]
mode = "standard"
max_wall_time_min = 60
max_cost_usd = 10.0

[providers.cloud_strong]
adapter = "openai_compatible"
base_url = "https://api.openai.com/v1"
model = "<api-model>"
api_key_env = "CRAFTIA_API_KEY"

[providers.cloud_anthropic]
adapter = "anthropic"
model = "<claude-model>"
api_key_env = "ANTHROPIC_API_KEY"

[roles.planner]
chain = ["cloud_anthropic", "cloud_strong"]

[roles.detailer]
chain = ["cloud_strong"]

[roles.critic_vision]
chain = ["cloud_anthropic", "cloud_strong"]
